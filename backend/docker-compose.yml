services:
  localstack:
    build:
      context: ./docker/localstack
      dockerfile: Dockerfile
    container_name: silkroad-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${LOCAL_S3_REGION:-us-east-1}
      - STORAGE_BUCKET=${LOCAL_S3_BUCKET:-silkroad-local}
      - STORAGE_REGION=${LOCAL_S3_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${LOCAL_S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${LOCAL_S3_ACCESS_KEY:-test}
      - AWS_SECRET_ACCESS_KEY=${LOCAL_S3_SECRET_KEY:-test}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silkroad-backend
    profiles: ["app"]
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "8443:8443"
    env_file:
      - .env
    environment:
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_S3_ENDPOINT=http://localstack:4566
      - LOCAL_S3_PUBLIC_ENDPOINT=http://localhost:4566
      - STORAGE_AUTO_CREATE_BUCKET=true
